<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · Clevertree Chat</title>
  <meta name="description" content="Live #web IRC room and SI panel for Clevertree Chat. One shared public room.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F2F4EF">
  <link rel="canonical" href="https://clevertree.chat/chat">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Clevertree Chat">
  <meta property="og:title" content="Chat · Clevertree Chat">
  <meta property="og:description" content="One shared #web room. IRC transcript + SI panel.">
  <meta property="og:url" content="https://clevertree.chat/chat">
  <meta property="og:image" content="https://clevertree.chat/images/og-default.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://clevertree.chat/images/og-default.jpg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script>
    try {
      var t = localStorage.getItem("ct-theme") || localStorage.getItem("clevertree.room.theme");
      if (t === "dark" || t === "light" || t === "system") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="stylesheet" href="/fronts/room/tokens.css">
  <link rel="stylesheet" href="/fronts/room/clevertree-room.css">
</head>
<body class="page-chat">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head">
    <div class="wrap nav">
      <a class="wordmark" href="/">
        <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 79V21 M50 56L26 35 M26 35V23 M26 35H38 M50 43L73 22 M73 22H61 M73 22V34 M50 70L77 55 M77 55H65 M77 55V67" fill="none" stroke="currentColor" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Clevertree Chat</span>
      </a>
      <nav aria-label="Primary">
        <a href="/chat" aria-current="page">Chat</a>
        <a href="/extension">Extension</a>
        <a href="/dev">Dev</a>
      </nav>
      <button type="button" class="theme" data-theme-toggle aria-label="Switch theme">◐</button>
    </div>
  </header>
  <main id="main">
    <div class="wrap chat-wrap">
      <div class="chat-notice">
        <span>Public IRC room <code class="mono">#web</code></span>
        <a href="/">About Clevertree Chat</a>
      </div>
      <div id="room-root" class="chat-host-root" aria-label="Clevertree Chat room"></div>
    </div>
  </main>
  <footer>
    <div class="wrap foot">
      <span>Clevertree Chat</span>
      <a href="/forest">Forest manifesto</a>
    </div>
  </footer>
  <script src="/fronts/room/context-tags.js"></script>
  <script src="/fronts/room/channel-route.js"></script>
  <script src="/fronts/room/clevertree-room.js"></script>
  <script src="/assets/site.js"></script>
  <script>
    (function () {
      var root = document.getElementById("room-root");
      if (!root || !window.CleverTreeRoom) return;
      var API = "https://api.clevertree.chat";
      CleverTreeRoom.mount(root, {
        mode: "page",
        channel: "#web",
        title: "Clevertree Chat",
        context: {},
        showNetworker: false,
        apiBase: API,
        wsUrl: "wss://api.clevertree.chat/api/chat/ws?topic=web",
        mirrors: [
          "wss://api.clevertree.chat/api/chat/ws?topic=web",
          "wss://pub1.relaygateway.net/chat/ws?topic=web"
        ],
        nick: "you"
      });
    })();
  </script>
</body>
</html>
