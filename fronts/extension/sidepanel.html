<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clevertree Chat</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app" class="ct-ext">
    <p class="ct-status" data-live="closed">Connecting…</p>
    <header class="ct-head">
      <div class="ct-brand">
        <img src="icons/icon32.png" alt="" width="22" height="22">
        <span>Clevertree Chat</span>
        <span class="ct-badge" id="mode-badge">Page</span>
      </div>
      <h1 class="ct-title" id="topic-title">This page</h1>
      <p class="ct-page" id="page-chip" title="">—</p>
      <p class="ct-meta" id="count-pill">0 perspectives · 0 points</p>
    </header>

    <div class="ct-toolbar">
      <button type="button" class="ct-linkish" id="btn-refresh" title="Reload tab topic">Refresh page</button>
      <button type="button" class="ct-linkish" id="btn-flock">Flock demo</button>
      <button type="button" class="ct-linkish" id="btn-thc">THC demo</button>
    </div>

    <aside class="ct-demo" id="demo-box" hidden>
      <div class="ct-demo-top">
        <div>
          <p class="ct-demo-kicker">Interactive demo</p>
          <h2 id="demo-heading">Guided walkthrough</h2>
          <p id="demo-message">Pauses after each update so you can see what changed.</p>
        </div>
        <button type="button" class="ct-play" id="btn-continue" aria-label="Continue" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <div class="ct-demo-actions">
        <button type="button" class="ct-linkish" id="btn-continue-text" hidden>Continue</button>
        <button type="button" class="ct-linkish" id="btn-demo-toggle">Disable demo mode</button>
        <button type="button" class="ct-linkish" id="btn-reset">Reset</button>
      </div>
      <p class="ct-demo-note">UI-only pause · server is not waiting</p>
    </aside>

    <div class="ct-body">
      <section class="ct-board" id="board"></section>
      <section class="ct-activity">
        <h2>Recent activity</h2>
        <ul id="activity" class="ct-act-list"></ul>
      </section>
    </div>

    <form class="ct-composer" id="composer">
      <label class="ct-composer-label" for="body">Add your perspective</label>
      <textarea id="body" name="body" rows="3" placeholder="What would you like to say?" required></textarea>
      <div class="ct-composer-row">
        <p class="ct-hint" id="composer-hint">Empty until you write. Soft tags may be revised by batch.</p>
        <button type="submit" class="ct-post-btn" id="btn-post">Post</button>
      </div>
      <p class="ct-status-msg" id="status-msg" hidden></p>
    </form>
  </div>
  <script src="normalize-url.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
