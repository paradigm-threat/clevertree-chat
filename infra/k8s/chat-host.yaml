# Clevertree Chat host on Intake (hostNetwork :8790)
# Apply after ConfigMap clevertree-chat-code (tree.tar.gz) exists.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clevertree-chat-data
  namespace: myproblem
  labels:
    app: clevertree-chat
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clevertree-chat
  namespace: myproblem
  labels:
    app: clevertree-chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clevertree-chat
  template:
    metadata:
      labels:
        app: clevertree-chat
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Single-node Intake Spot stand — do not pin hostname (Spot replaces instance ids).
      containers:
        - name: chat
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              tar -xzf /code/tree.tar.gz -C /app
              # PVC keeps comments/auth across rollouts (code tarball must not replace it).
              mkdir -p /app/var/clevertree-live/comments /app/var/clevertree-live/auth
              pip install --no-cache-dir -q -r /app/requirements.txt
              export CLEVERTREE_COMMENTS_PATH=/app/var/clevertree-live/comments
              export CLEVERTREE_AUTH_PATH=/app/var/clevertree-live/auth
              export CLEVERTREE_GIT_FALLBACK=1
              # Full SoT on PVC: skip fixture seed; optional clone when marker missing + token.
              export CLEVERTREE_SEED_FIXTURES="${CLEVERTREE_SEED_FIXTURES:-0}"
              export CLEVERTREE_FETCH="${CLEVERTREE_FETCH:-1}"
              # GPU wake stays off until RACKSPACE_SPOT_TOKEN is in the secret.
              export CLEVERTREE_SPOT_WAKE="${CLEVERTREE_SPOT_WAKE:-0}"
              export CLEVERTREE_IRC_ENABLE="${CLEVERTREE_IRC_ENABLE:-1}"
              export CLEVERTREE_IRC_HOST="${CLEVERTREE_IRC_HOST:-flashbackrepository.org}"
              export CLEVERTREE_IRC_PORT="${CLEVERTREE_IRC_PORT:-6697}"
              export CLEVERTREE_IRC_TLS="${CLEVERTREE_IRC_TLS:-1}"
              export CLEVERTREE_IRC_NICK="${CLEVERTREE_IRC_NICK:-clevertree-si}"
              export CLEVERTREE_IRC_PREFIX="${CLEVERTREE_IRC_PREFIX:-pt}"
              if [[ ! -f /app/var/clevertree-live/comments/.clevertree-full-sot ]] \
                && [[ -n "${CLEVERTREE_GITHUB_TOKEN:-}" ]] \
                && [[ -x /app/scripts/bootstrap_comments_checkout.sh || -f /app/scripts/bootstrap_comments_checkout.sh ]]; then
                bash /app/scripts/bootstrap_comments_checkout.sh /app/var/clevertree-live/comments || true
              fi
              exec python3 scripts/chat_host.py 8790
          env:
            - name: CLEVERTREE_SEED_FIXTURES
              value: "0"
            - name: CLEVERTREE_FETCH
              value: "1"
            - name: CLEVERTREE_SPOT_WAKE
              value: "0"
            - name: CLEVERTREE_IRC_ENABLE
              value: "1"
            - name: CLEVERTREE_IRC_HOST
              value: flashbackrepository.org
            - name: CLEVERTREE_IRC_PORT
              value: "6697"
            - name: CLEVERTREE_IRC_TLS
              value: "1"
            - name: CLEVERTREE_IRC_NICK
              value: clevertree-si
            - name: CLEVERTREE_IRC_PREFIX
              value: pt
          ports:
            - containerPort: 8790
              hostPort: 8790
              name: http
          readinessProbe:
            httpGet:
              path: /chat
              port: 8790
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /chat
              port: 8790
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
            - name: data
              mountPath: /app/var/clevertree-live
      volumes:
        - name: code
          configMap:
            name: clevertree-chat-code
        - name: data
          persistentVolumeClaim:
            claimName: clevertree-chat-data
---
apiVersion: v1
kind: Service
metadata:
  name: clevertree-chat
  namespace: myproblem
spec:
  selector:
    app: clevertree-chat
  ports:
    - port: 8790
      targetPort: 8790
      name: http
  type: ClusterIP
