name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e-a11y:
    name: E2E + a11y contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Durable board + website room E2E
        run: npx playwright test tests/e2e/chat-websocket.spec.ts tests/e2e/website-url-room.spec.ts
      - name: Live embed shell
        run: npx playwright test tests/e2e/live-embed.spec.ts
      - name: ADA contrast (axe WCAG AA)
        run: npx playwright test tests/e2e/a11y-contrast.spec.ts tests/e2e/a11y-room-contrast.spec.ts

  android-room:
    name: Android room AAR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=""
          for cand in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/20.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$cand" ]; then SM="$cand"; break; fi
          done
          if [ -z "$SM" ]; then
            SM="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)"
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SM" --licenses >/tmp/android-licenses.log || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
      - name: Assemble + unit tests
        working-directory: android
        run: ./gradlew :clevertree-room:assembleRelease :clevertree-room:test --stacktrace
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: clevertree-room-aar
          path: android/clevertree-room/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Assemble standalone APK
        working-directory: android
        run: ./gradlew :clevertree-app:assembleRelease --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clevertree-chat-apk
          path: android/clevertree-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        working-directory: android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.1.0"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          ./gradlew :clevertree-room:publishReleasePublicationToGitHubPackagesRepository \
            -Pclevertree.room.version="$VERSION" \
            --stacktrace
