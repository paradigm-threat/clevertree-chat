# XcodeGen spec — on a Mac: `brew install xcodegen && cd ios/ClevertreeApp && xcodegen generate`
# Then open ClevertreeApp.xcodeproj
name: ClevertreeApp
options:
  bundleIdPrefix: chat.clevertree
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_VERSION: "5.0"
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: "0.1.0"
packages:
  ClevertreeRoom:
    path: ../ClevertreeRoom
targets:
  ClevertreeApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.clevertree.app
      PRODUCT_NAME: ClevertreeChat
      INFOPLIST_FILE: Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Signing — set your Team ID on a Mac (Signing & Capabilities).
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "" # PLACEHOLDER — fill in Xcode
    dependencies:
      - package: ClevertreeRoom
        product: ClevertreeRoom

  ClevertreeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ClevertreeApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.clevertree.app.tests
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClevertreeChat.app/ClevertreeChat"
  ClevertreeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ClevertreeApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: chat.clevertree.app.uitests
schemes:
  ClevertreeApp:
    build:
      targets:
        ClevertreeApp: all
        ClevertreeAppTests: [test]
        ClevertreeAppUITests: [test]
    test:
      targets:
        - ClevertreeAppTests
        - ClevertreeAppUITests
      gatherCoverageData: false
